name: V3 R1 G00 S00 Secure Factory

"on":
  pull_request:
    branches:
      - v3/main

permissions:
  contents: read

concurrency:
  group: v3-r1-s00-${{ github.event.pull_request.number }}-${{ github.sha }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  YSF_EXTERNAL_EFFECT_BUDGET: DENY_ALL
  YSF_PROVIDERS: "OFF"
  YSF_EMAIL_MODE: NON_RELAYING
  YSF_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}

jobs:
  policy:
    name: S00 / policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout exact evaluated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up approved Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.2
          cache: ""
      - name: Install hash-locked development inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 027
          wheelhouse="${RUNNER_TEMP}/s00-policy-wheelhouse"
          python -m pip download \
            --dest "$wheelhouse" \
            --only-binary=:all: \
            --require-hashes \
            --requirement tools/ysf/requirements-s00-dev.lock
          python -m pip install \
            --no-index \
            --find-links "$wheelhouse" \
            --only-binary=:all: \
            --require-hashes \
            --requirement tools/ysf/requirements-s00-dev.lock
          python -m pip check
      - name: Enforce source, corpus, identity and no-effect policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 027
          export GITHUB_SHA="$YSF_SOURCE_COMMIT"
          export YSF_SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          export PYTHONPATH="$PWD/tools/ysf/src"
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import sys

          from ysf.secure_factory.environment import (
              load_expectation,
              validate_candidate_build_environment,
          )
          from ysf.secure_factory.models import FactoryFailure
          from ysf.secure_factory.policy import (
              QUARANTINED_FIXTURES,
              mutation_paths,
              validate_changed_paths,
              validate_live_governance,
              verify_immutable_corpus,
              verify_approved_contract,
              verify_policy_self_protection,
          )
          from ysf.secure_factory.sensitive import require_no_sensitive_values

          root = Path.cwd()
          context = root / "docs/v3/r1/g00/s00"
          expectation = load_expectation(context / "environment-identity.yaml")
          validate_candidate_build_environment(expectation, root)
          verify_policy_self_protection(context / "source-and-delivery-policy.md")
          verify_approved_contract(root)
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          pull = event["pull_request"]
          try:
              governance = validate_live_governance(
                  repository=os.environ["GITHUB_REPOSITORY"],
                  pr_number=int(event["number"]),
                  expected_base_ref=pull["base"]["ref"],
                  expected_base_sha=pull["base"]["sha"],
                  expected_head_ref=pull["head"]["ref"],
                  expected_head_sha=pull["head"]["sha"],
                  expected_head_tree=os.environ["YSF_SOURCE_TREE"],
                  run_id=os.environ["GITHUB_RUN_ID"],
              )
          except FactoryFailure as exc:
              print(exc.code, file=sys.stderr)
              raise SystemExit(1) from exc
          paths = mutation_paths(root, base_ref="origin/v3/main")
          validate_changed_paths(root, paths)
          verify_immutable_corpus(root)
          inputs = [
              root / path
              for path in sorted(paths - QUARANTINED_FIXTURES)
              if (root / path).is_file()
          ]
          require_no_sensitive_values(inputs)
          print(json.dumps(governance.to_dict(), sort_keys=True, separators=(",", ":")))
          print("RESULT=PASS_S00_POLICY")
          PY
      - name: Verify workflow self-policy and CODEOWNERS
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 027
          python - <<'PY'
          from pathlib import Path

          import yaml

          workflow_path = Path(".github/workflows/v3-r1-s00-secure-factory.yml")
          text = workflow_path.read_text(encoding="utf-8")
          value = yaml.safe_load(text)
          expected_names = {
              "policy": "S00 / policy",
              "test": "S00 / test",
              "build-candidate": "S00 / build-candidate",
              "verify-candidate": "S00 / verify-candidate",
          }
          if value.get("permissions") != {"contents": "read"}:
              raise SystemExit("workflow permissions are not read-only")
          jobs = value.get("jobs")
          if not isinstance(jobs, dict) or set(jobs) != set(expected_names):
              raise SystemExit("workflow job set mismatch")
          expected_permissions = {
              "policy": {"contents": "read", "issues": "read"},
              "test": {"contents": "read"},
              "build-candidate": {"contents": "read", "issues": "read"},
              "verify-candidate": {"contents": "read"},
          }
          for job_id, expected_name in expected_names.items():
              job = jobs[job_id]
              if job.get("name") != expected_name:
                  raise SystemExit(f"job name mismatch: {job_id}")
              if job.get("permissions") != expected_permissions[job_id]:
                  raise SystemExit(f"job permissions mismatch: {job_id}")
          forbidden_trigger = "pull_request" + "_target"
          secret_expression = "$" + "{{" + " secrets."
          if forbidden_trigger in text or secret_expression in text:
              raise SystemExit("forbidden trigger or secret reference")
          build_command = "bash scripts/v3-r1-s00.sh " + "build-candidate"
          if text.count(build_command) != 1:
              raise SystemExit("build-once command count mismatch")
          verify_text = yaml.safe_dump(jobs["verify-candidate"], sort_keys=True)
          if (
              "verify-candidate" not in verify_text
              or build_command in verify_text
          ):
              raise SystemExit("clean-room verification boundary mismatch")
          if Path(".github/CODEOWNERS").read_text(encoding="utf-8") != "* @nvkhoabk\n":
              raise SystemExit("CODEOWNERS mismatch")
          print("RESULT=PASS_WORKFLOW_SELF_POLICY")
          PY
      - name: Prove quarantined known-bad fixtures fail closed
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 027
          output_root="${RUNNER_TEMP}/s00-policy-known-bad"
          YSF_S00_OUTPUT_ROOT="$output_root" \
            bash scripts/v3-r1-s00.sh known-bad

  test:
    name: S00 / test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact evaluated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up approved Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.2
          cache: ""
      - name: Install hash-locked development inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 027
          wheelhouse="${RUNNER_TEMP}/s00-test-wheelhouse"
          python -m pip download \
            --dest "$wheelhouse" \
            --only-binary=:all: \
            --require-hashes \
            --requirement tools/ysf/requirements-s00-dev.lock
          python -m pip install \
            --no-index \
            --find-links "$wheelhouse" \
            --only-binary=:all: \
            --require-hashes \
            --requirement tools/ysf/requirements-s00-dev.lock
          python -m pip check
      - name: Run full quality graph in an isolated source copy
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 027
          validation_repository="${RUNNER_TEMP}/s00-test-repository"
          cp -a -- "$GITHUB_WORKSPACE" "$validation_repository"
          cd "$validation_repository/tools/ysf"
          python -m ruff check src/ysf tests
          python -m mypy src/ysf
          python -m pytest tests \
            --cov=ysf.secure_factory \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90
          python -m bandit -q -r src/ysf --severity-level medium
          python -m pip_audit \
            --require-hashes \
            --no-deps \
            --strict \
            --progress-spinner off \
            --requirement requirements-s00-dev.lock
      - name: Execute and preserve the RP-C negative security matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 027
          matrix_root="${RUNNER_TEMP}/s00-rp-c-matrix"
          mkdir -m 0750 "$matrix_root"
          (
            cd tools/ysf
            python -m pytest \
              tests/unit/test_secure_factory_candidate.py \
              tests/unit/test_secure_factory_environment.py \
              tests/unit/test_secure_factory_policy.py \
              tests/unit/test_secure_factory_sensitive.py \
              tests/integration/test_secure_factory_pipeline.py \
              --junitxml="$matrix_root/rp-c-regression.xml"
          )
          YSF_S00_OUTPUT_ROOT="$matrix_root" \
            bash scripts/v3-r1-s00.sh rp-c-matrix
          mapfile -t results < <(find "$matrix_root" -type f -name result.json -print)
          [[ "${#results[@]}" -eq 1 ]]
          python - "${results[0]}" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("result") != "PASS" or len(value.get("gates", [])) < 12:
              raise SystemExit("RP-C matrix result is incomplete")
          PY
          printf 'S00_RP_C_MATRIX_ROOT=%s\n' "$matrix_root" >>"$GITHUB_ENV"
      - name: Upload immutable RP-C matrix evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-r1-s00-rp-c-matrix-${{ github.event.pull_request.head.sha }}
          path: ${{ env.S00_RP_C_MATRIX_ROOT }}
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 7

  build-candidate:
    name: S00 / build-candidate
    needs:
      - policy
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout exact evaluated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up approved Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.2
          cache: ""
      - name: Install hash-locked development inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 027
          wheelhouse="${RUNNER_TEMP}/s00-build-wheelhouse"
          python -m pip download \
            --dest "$wheelhouse" \
            --only-binary=:all: \
            --require-hashes \
            --requirement tools/ysf/requirements-s00-dev.lock
          python -m pip install \
            --no-index \
            --find-links "$wheelhouse" \
            --only-binary=:all: \
            --require-hashes \
            --requirement tools/ysf/requirements-s00-dev.lock
          python -m pip check
      - name: Generate exact candidate quality inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 027
          quality_root="${RUNNER_TEMP}/s00-quality"
          validation_repository="${RUNNER_TEMP}/s00-build-validation-repository"
          mkdir -m 0750 "$quality_root"
          cp -a -- "$GITHUB_WORKSPACE" "$validation_repository"
          cd "$validation_repository/tools/ysf"
          export PYTHONPATH="$validation_repository/tools/ysf/src"
          export QUALITY_ROOT="$quality_root"
          export SOURCE_BRANCH="${GITHUB_HEAD_REF:?missing GITHUB_HEAD_REF}"
          export SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          export CHANGED_PATHS_JSON="$(
            git diff --name-only -z origin/v3/main...HEAD |
              python -c 'import json,sys; print(json.dumps(sorted(item.decode() for item in sys.stdin.buffer.read().split(b"\0") if item)))'
          )"
          export INPUT_DIGESTS_JSON="$(python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from ysf.secure_factory.policy import (
              APPROVED_CONTRACT_SHA256,
              CONTRACT_RELATIVE_PATH,
          )

          def digest(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          contract_actual = digest(str(Path.cwd().parents[1] / CONTRACT_RELATIVE_PATH))
          if contract_actual != APPROVED_CONTRACT_SHA256:
              raise SystemExit("FAIL_CONTRACT_DIGEST")
          print(json.dumps({
              "contract_path": CONTRACT_RELATIVE_PATH,
              "contract_actual_sha256": contract_actual,
              "contract_approved_sha256": APPROVED_CONTRACT_SHA256,
              "contract_digest_match": "true",
              "head_tree": os.environ["SOURCE_TREE"],
              "requirements-s00-build.lock": digest("requirements-s00-build.lock"),
              "requirements-s00-dev.lock": digest("requirements-s00-dev.lock"),
          }, sort_keys=True, separators=(",", ":")))
          PY
          )"

          run_gate() {
            local gate="$1"
            local report="$2"
            local log_path="${quality_root}/${gate}.log"
            local output_path="${quality_root}/quality-outputs/${gate}.json"
            local status
            shift 2
            if "$@" >"$log_path" 2>&1; then
              status=0
            else
              status=$?
            fi
            GATE_NAME="$gate" GATE_STATUS="$status" RAW_PATH="$log_path" OUTPUT_PATH="$output_path" \
              python - <<'PY'
          import os
          from pathlib import Path

          from ysf.secure_factory.candidate import write_sanitized_quality_output

          write_sanitized_quality_output(
              os.environ["GATE_NAME"],
              int(os.environ["GATE_STATUS"]),
              Path(os.environ["RAW_PATH"]),
              Path(os.environ["OUTPUT_PATH"]),
          )
          PY
            cat "$log_path"
            GATE_NAME="$gate" GATE_STATUS="$status" REPORT_NAME="$report" OUTPUT_PATH="$output_path" \
              python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from datetime import UTC, datetime
          from pathlib import Path

          gate = os.environ["GATE_NAME"]
          status = int(os.environ["GATE_STATUS"])
          root = Path(os.environ["QUALITY_ROOT"])
          report = root / os.environ["REPORT_NAME"]
          output = Path(os.environ["OUTPUT_PATH"])
          record = {
              "execution_id": (
                  f"GHA-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-"
                  f"{gate.upper().replace('-', '_')}"
              ),
              "timestamp_utc": datetime.now(UTC).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "mutation_class": "READ_ONLY_QUALITY_GATE",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "branch": os.environ["SOURCE_BRANCH"],
              "head_commit": os.environ["YSF_SOURCE_COMMIT"],
              "head_tree": os.environ["SOURCE_TREE"],
              "contract_sha256": json.loads(os.environ["INPUT_DIGESTS_JSON"])["contract_actual_sha256"],
              "contract_path": json.loads(os.environ["INPUT_DIGESTS_JSON"])["contract_path"],
              "contract_actual_sha256": json.loads(os.environ["INPUT_DIGESTS_JSON"])["contract_actual_sha256"],
              "contract_approved_sha256": json.loads(os.environ["INPUT_DIGESTS_JSON"])["contract_approved_sha256"],
              "contract_digest_match": True,
              "environment_identity": {
                  "architecture": platform.machine(),
                  "email_mode": os.environ["YSF_EMAIL_MODE"],
                  "external_effect_budget": os.environ["YSF_EXTERNAL_EFFECT_BUDGET"],
                  "providers": os.environ["YSF_PROVIDERS"],
                  "python_version": platform.python_version(),
                  "runner_os": os.environ.get("RUNNER_OS", "Linux"),
              },
              "changed_paths": json.loads(os.environ["CHANGED_PATHS_JSON"]),
              "input_digests": json.loads(os.environ["INPUT_DIGESTS_JSON"]),
              "command_or_gate": gate,
              "exit_code": status,
              "result": "PASS" if status == 0 else "FAIL",
              "next_allowed_action": "BUILD_ONCE_CANDIDATE" if status == 0 else "STOP_AND_REVIEW",
              "output_path": f"reports/quality-outputs/{gate}.json",
              "output_size": output.stat().st_size,
              "output_sha256": hashlib.sha256(output.read_bytes()).hexdigest(),
          }
          if gate == "pytest":
              record["branch_coverage_threshold_percent"] = 90
          value = {"schema_version": 1, "result": "PASS", "records": []}
          if report.exists():
              value = json.loads(report.read_text(encoding="utf-8"))
          value["records"].append(record)
          value["result"] = "PASS" if all(item["result"] == "PASS" for item in value["records"]) else "FAIL"
          report.write_text(json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
            return "$status"
          }

          governance_readback() {
            python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from ysf.secure_factory.models import FactoryFailure
          from ysf.secure_factory.policy import validate_live_governance

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          pull = event["pull_request"]
          try:
              gate = validate_live_governance(
                  repository=os.environ["GITHUB_REPOSITORY"],
                  pr_number=int(event["number"]),
                  expected_base_ref=pull["base"]["ref"],
                  expected_base_sha=pull["base"]["sha"],
                  expected_head_ref=pull["head"]["ref"],
                  expected_head_sha=pull["head"]["sha"],
                  expected_head_tree=os.environ["SOURCE_TREE"],
                  run_id=os.environ["GITHUB_RUN_ID"],
              )
          except FactoryFailure as exc:
              print(exc.code, file=sys.stderr)
              raise SystemExit(1) from exc
          print(json.dumps(gate.to_dict(), sort_keys=True, separators=(",", ":")))
          PY
          }

          run_gate environment-identity environment-identity.json \
            python -c 'import json,os; value={"external_effect_budget":os.environ["YSF_EXTERNAL_EFFECT_BUDGET"],"providers":os.environ["YSF_PROVIDERS"],"email_mode":os.environ["YSF_EMAIL_MODE"]}; assert value=={"external_effect_budget":"DENY_ALL","providers":"OFF","email_mode":"NON_RELAYING"}; print(json.dumps(value,sort_keys=True,separators=(",",":")))'
          run_gate governance-readback governance-readback.json governance_readback
          run_gate ruff lint-type-sast-dependency.json python -m ruff check src/ysf tests
          run_gate mypy lint-type-sast-dependency.json python -m mypy src/ysf
          run_gate pytest test-and-coverage.json python -m pytest tests \
            --cov=ysf.secure_factory --cov-branch --cov-report=term-missing --cov-fail-under=90
          python - <<'PY'
          from pathlib import Path

          from ysf.secure_factory.candidate import normalize_generated_admin_email

          root = Path.cwd().parents[1]
          normalize_generated_admin_email(
              root / "factory/prompts/generated/s00/t00/prompt.md"
          )
          PY
          run_gate bandit lint-type-sast-dependency.json \
            python -m bandit -q -f json -r src/ysf --severity-level medium
          run_gate pip-audit lint-type-sast-dependency.json python -m pip_audit \
            --require-hashes --no-deps --strict --progress-spinner off \
            --format json --requirement requirements-s00-dev.lock
          run_gate leak-scan leak-scan.json python -c \
            'import json; from pathlib import Path; from ysf.secure_factory.policy import QUARANTINED_FIXTURES, mutation_paths; from ysf.secure_factory.sensitive import require_no_sensitive_values; root=Path.cwd().parents[1]; paths=mutation_paths(root, base_ref="origin/v3/main"); gate=require_no_sensitive_values(root/path for path in sorted(paths-QUARANTINED_FIXTURES) if (root/path).is_file()); print(json.dumps(gate.to_dict(),sort_keys=True,separators=(",",":")))'

          python - "$quality_root" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          report_names = (
              "test-and-coverage.json",
              "lint-type-sast-dependency.json",
              "leak-scan.json",
              "environment-identity.json",
              "governance-readback.json",
          )
          records = []
          for name in report_names:
              value = json.loads((root / name).read_text(encoding="utf-8"))
              if value["result"] != "PASS":
                  raise SystemExit(f"quality report failed: {name}")
              records.extend(value["records"])
          if len(records) != 8 or len({item["command_or_gate"] for item in records}) != 8:
              raise SystemExit("quality gate set is not exact")
          (root / "execution-ledger.jsonl").write_text(
              "".join(json.dumps(item, sort_keys=True, separators=(",", ":")) + "\n" for item in records),
              encoding="utf-8",
          )
          for path in root.glob("*.log"):
              path.unlink()
          PY

          printf 'YSF_S00_QUALITY_ROOT=%s\n' "$quality_root" >>"$GITHUB_ENV"
      - name: Build exactly one candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 027
          output_root="${RUNNER_TEMP}/s00-build-output"
          export GITHUB_SHA="$YSF_SOURCE_COMMIT"
          YSF_S00_OUTPUT_ROOT="$output_root" \
          YSF_S00_QUALITY_ROOT="$YSF_S00_QUALITY_ROOT" \
            bash scripts/v3-r1-s00.sh build-candidate
          mapfile -t candidates < <(find "$output_root" -type d -name candidate -print)
          [[ "${#candidates[@]}" -eq 1 ]]
          bash scripts/v3-r1-s00.sh verify-candidate "${candidates[0]}"
          transfer_root="${RUNNER_TEMP}/s00-candidate-transfer"
          mkdir -m 0750 "$transfer_root"
          cp -a -- "${candidates[0]}" "$transfer_root/candidate"
          printf 'S00_CANDIDATE_TRANSFER_ROOT=%s\n' "$transfer_root" >>"$GITHUB_ENV"
      - name: Upload exact checksummed candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-r1-s00-candidate-${{ github.event.pull_request.head.sha }}
          path: ${{ env.S00_CANDIDATE_TRANSFER_ROOT }}
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 7

  verify-candidate:
    name: S00 / verify-candidate
    needs:
      - build-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact verification source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up approved Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.2
          cache: ""
      - name: Install hash-locked verification inputs only
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 027
          wheelhouse="${RUNNER_TEMP}/s00-verify-wheelhouse"
          python -m pip download \
            --dest "$wheelhouse" \
            --only-binary=:all: \
            --require-hashes \
            --requirement tools/ysf/requirements-s00-dev.lock
          python -m pip install \
            --no-index \
            --find-links "$wheelhouse" \
            --only-binary=:all: \
            --require-hashes \
            --requirement tools/ysf/requirements-s00-dev.lock
          python -m pip check
      - name: Download build-once candidate bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v3-r1-s00-candidate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/s00-candidate-input
      - name: Clean-room verify without rebuild or installation
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 027
          candidate_path="${RUNNER_TEMP}/s00-candidate-input/candidate"
          test -d "$candidate_path"
          output_root="${RUNNER_TEMP}/s00-verify-output"
          YSF_S00_OUTPUT_ROOT="$output_root" \
            bash scripts/v3-r1-s00.sh verify-candidate "$candidate_path"
          test -z "$(find . -type f \( -name '*.whl' -o -name 'artifact-manifest.json' \) -print -quit)"
