services:
  postgres:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    environment:
      POSTGRES_DB: ysim
      POSTGRES_USER: ysim
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ysim -d ysim"]
      interval: 1s
      timeout: 3s
      retries: 30
    labels:
      io.ysim.slice: vs-r1-001
