source_bootstrap_authority_after_rp_a:
  operator: Khoa Nguyen
  authorized_operations:
    - Apply the exact approved ruleset to refs/heads/v3/main before the branch exists.
    - Read back and verify the ruleset.
    - Create v3/main at the exact approved seed commit.
    - Read back and verify the remote ref and tree.
    - Create isolated local checkout /root/projects/ysim-v3-r1/ysim.
    - Create implementation branch feature/v3-r1-g00-s00-secure-factory from v3/main.
    - Push the implementation branch for required checks and review after local verification.
  forbidden_operations:
    - Merge to v3/main.
    - Change the repository default branch.
    - Create a tag or release.
    - Weaken or bypass the ruleset.
    - Modify any source ref outside the two named branches.
ruleset_contract:
  target: refs/heads/v3/main
  apply_before_branch_creation: true
  pull_request_required: true
  required_human_approvals: 1
  dismiss_stale_approvals: true
  require_code_owner_review: true
  require_conversation_resolution: true
  required_status_checks:
    - S00 / policy
    - S00 / test
    - S00 / build-candidate
    - S00 / verify-candidate
  block_force_push: true
  block_deletion: true
  operator: Khoa Nguyen
  verification: Independent read-only ruleset/ref readback before source implementation.
  failure_result: BLOCKED_SOURCE_CONTROL_NOT_ESTABLISHED
acceptance:
  RP-A:
    - Exact seed commit/tree and unaccepted-seed interpretation approved.
    - Read-only repository/toolchain/CI inventory approved.
    - Exact 36-file allowlist and default-deny protected-path policy approved.
    - Exact ruleset controls, application order, operator and readback approved.
    - Clean-room CI no-business-effect RP-D exception approved.
    - Reproducible ysf Python wheel as harmless proof artifact approved.
    - External-effect budget remains DENY_ALL.
    - Contract digest receives HUMAN_CONTRACT_APPROVED from Khoa Nguyen.
  RP-B:
    - Quarantined known-bad path or sensitive fixture is rejected at the intended gate.
    - Failed execution evidence is preserved under a unique immutable execution ID.
    - Compliant run produces wheel, artifact manifest, SBOM, provenance and checksums.
    - No changed path exists outside the exact allowlist.
    - No business external effect or application deployment occurs.
    - Human records ACCEPT, CHANGES_REQUESTED or REJECT against exact evidence.
  RP-C:
    - Full wrong-identity, path, corpus, lock, approval, ruleset, leak, tamper, rebuild and self-protection matrix passes.
    - Ruff, mypy, pytest, coverage, Bandit, dependency/SCA and SBOM checks complete without silent skip.
    - Separate Codex reviewer run resolves technical findings and remains advisory.
    - Khoa Nguyen separately records Human source/security acceptance.
  RP-D:
    - Exact candidate artifact and evidence bytes are consumed by a separate clean-room GitHub Actions verification job.
    - RP-D does not rebuild, install into application runtime or deploy the candidate.
    - Job has read-only repository permission, no secrets and no business-provider target.
    - Artifact digest, provenance, SBOM, leak scan and effect policy are reverified.
    - Khoa Nguyen records the integrated tooling acceptance against the exact candidate digest.
