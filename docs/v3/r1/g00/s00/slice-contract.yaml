migration_and_compatibility: >-
  No database, service or runtime migration. The seed tree transfers no legacy
  maturity. Existing ysf behavior outside the exact allowlist must remain
  regression-compatible or the Slice stops for a contract revision.
rollback_and_reconciliation: >-
  No business external reconciliation is possible or permitted. Before merge,
  all implementation changes remain isolated on the named feature branch and
  can be superseded only through reviewed version history. Ruleset or source-ref
  mismatch stops further mutation and requires Human review. Failed execution
  and candidate identities remain append-only.
