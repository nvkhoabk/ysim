  resolution_decision: REFINE
  release_requirement:
    statement: The Release 1 pilot shall apply an explicit customer lifecycle state machine to customer relationships.
    release_scope: Lifecycle states and transitions required for pilot onboarding, service, retention, and inactivity handling.
    owner: Customer Success
    acceptance_criteria:
    - id: V3-R1-CUS-002-AC-01
