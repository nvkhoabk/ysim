  resolution_decision: REFINE
  release_requirement:
    statement: The Release 1 pilot shall accept policy-controlled communication requests derived from business events while delivery providers remain disabled.
    release_scope: Synthetic notification request, template selection, recipient class, channel policy, and delivery-status recording.
    owner: Communication Platform
    acceptance_criteria:
    - id: V3-R1-MSG-001-AC-01
      condition: A synthetic business event produces at most one idempotent communication request with correlation identifier, template, locale, channel, and policy decision.
      verification: Automated source, unit, or integration evidence on synthetic data must demonstrate this condition.
    - id: V3-R1-MSG-001-AC-02
      condition: When providers are OFF, the request is retained in a non-relaying state and no outbound delivery operation is attempted.
      verification: Automated source, unit, or integration evidence on synthetic data must demonstrate this condition.
    out_of_scope:
    - Real email, SMS, chat, voice, or customer delivery is outside this checkpoint.
