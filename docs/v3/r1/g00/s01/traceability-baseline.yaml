  selection_id: V3-R1-HR-001
  resolution_decision: REFINE
  release_requirement:
    statement: The Release 1 pilot shall record and reconcile settlement obligations between identified Distribution Network entities without executing a provider payment.
    release_scope: Pilot settlement ledger and reconciliation for synthetic order and commission records.
    owner: Finance and Reconciliation
    acceptance_criteria:
    - id: V3-R1-FIN-003-AC-01
      condition: Every settlement obligation records debtor entity, creditor entity, currency, amount, source order, correlation identifier, and lifecycle status.
      verification: Automated source, unit, or integration evidence on synthetic data must demonstrate this condition.
    - id: V3-R1-FIN-003-AC-02
      condition: A reconciliation run matches synthetic settlement totals to the source order ledger and flags every non-zero unexplained difference.
      verification: Automated source, unit, or integration evidence on synthetic data must demonstrate this condition.
    out_of_scope:
    - Payment-provider execution and movement of real funds are outside Release 1 source scope.
