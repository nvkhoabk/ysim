      verification: Automated source, unit, or integration evidence on synthetic data must demonstrate this condition.
    - id: V3-R1-CUS-002-AC-02
      condition: A test traverses every permitted transition and proves that an unlisted transition fails without changing the stored state.
      verification: Automated source, unit, or integration evidence on synthetic data must demonstrate this condition.
    out_of_scope:
    - Enterprise CRM automation and predictive lifecycle scoring are outside Release 1.
