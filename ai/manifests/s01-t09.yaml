schema_version: "1.0"

project:
  code: YSIM
  version: "2.1"

sprint:
  code: S01
  baseline: architecture-v2.2

task:
  code: s01-t09
  order: 9
  name: "Quality Gates, CI & Validation"
  status: planned
  execution_mode: sequential

depends_on:
  - s01-t08

objective: >
  Implement the quality gates, ci & validation while preserving all
  architecture invariants and avoiding business-domain implementation.

scope:
  include:
    - "lint"
    - "typecheck"
    - "tests"
    - "GitHub Actions"
    - "verification scripts"

  exclude:
    - "Product"
    - "Pricing"
    - "Order"
    - "Payment"
    - "Allocation"
    - "Supplier Gateway"

quality_gates:
  - "git diff --check"
  - "ysf verify"

deliverables:
  - "Implementation"
  - "Task report"
  - "Validation evidence"

commit:
  message: "feat(s01-t09): Quality Gates, CI & Validation"
