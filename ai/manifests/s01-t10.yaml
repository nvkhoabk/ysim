schema_version: "1.0"

project:
  code: YSIM
  version: "2.1"

sprint:
  code: S01
  baseline: architecture-v2.2

task:
  code: s01-t10
  order: 10
  name: "Sprint Review, Evidence & Acceptance"
  status: planned
  execution_mode: sequential

depends_on:
  - s01-t09

objective: >
  Implement the sprint review, evidence & acceptance while preserving all
  architecture invariants and avoiding business-domain implementation.

scope:
  include:
    - "review"
    - "evidence"
    - "acceptance"
    - "handover"
    - "release report"

  exclude:
    - "Product"
    - "Pricing"
    - "Order"
    - "Payment"
    - "Allocation"
    - "Supplier Gateway"

quality_gates:
  - "git diff --check"
  - "ysf verify"

deliverables:
  - "Implementation"
  - "Task report"
  - "Validation evidence"

commit:
  message: "feat(s01-t10): Sprint Review, Evidence & Acceptance"
