[build-system]
requires = [
  "setuptools==83.0.0",
  "wheel==0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "ysf"
version = "0.1.0"
description = "YSim Software Factory production toolchain"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.2",
  "types-PyYAML==6.0.12.20260724",
]

[project.scripts]
ysf = "ysf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["ysf"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ysf"]
mypy_path = "src"

[tool.bandit]
exclude_dirs = ["tests"]
skips = []
