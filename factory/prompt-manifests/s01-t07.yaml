schema_version: '1.0'
prompt:
  id: s01-t07
  sprint: S01
  task: T07
  provider: codex
  template: factory/prompts/templates/codex-task.md
objective: Provide operational endpoints and API documentation so humans and infrastructure
  can determine whether the API is alive, ready, correctly configured, and discoverable.
context:
  directory: factory/contexts/generated/s01
  manifest: factory/contexts/generated/s01/context.json
  content: factory/contexts/generated/s01/context.md
repository:
  include_status: true
  include_branch: true
  include_recent_commits: 10
  include_tree_depth: 2
constraints:
  allowed_paths:
  - factory/
  - knowledge/
  - tools/
  - scripts/
  - docs/ESPK/
  protected_paths:
  - docs/AFM/
  - docs/BRD/
  - docs/ABP/
  - docs/YADF/
  - docs/AAP/
  - docs/SGP/
  - docs/ESP/
  - docs/DIP/
  - docs/ROP/
validation:
  commands:
  - ysf verify
  - git diff --check
completion:
  required_outputs:
  - repository assessment
  - identified risks
  - validation result
  - implementation recommendation
output:
  directory: factory/prompts/generated/s01/t07
